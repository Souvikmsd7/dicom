server {
  gzip_static  always;
  gzip_proxied expired no-cache no-store private auth;
  gunzip       on;
  listen ${PORT} default_server;
  listen [::]:${PORT} default_server;

  client_max_body_size 500M;

  # Serve app-config.js uncompressed and fresh
  location = /app-config.js {
    root /usr/share/nginx/html;
    gzip_static off;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Proxy DICOMweb requests to Orthanc inside the Docker network
  location /dicom-web/ {
    proxy_pass http://orthanc:8042/dicom-web/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Supply Orthanc Basic Auth credentials server-side (orthanc:orthanc-dev-2024)
    proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5jLWRldi0yMDI0";

    # Support streaming and multipart responses for DICOMweb WADO-RS
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;

    # CORS support
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

    if ($request_method = 'OPTIONS') {
      return 204;
    }
  }

  location /wado {
    proxy_pass http://orthanc:8042/wado;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Basic b3J0aGFuYzpvcnRoYW5jLWRldi0yMDI0";

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept" always;

    if ($request_method = 'OPTIONS') {
      return 204;
    }
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ ${PUBLIC_URL}index.html;
    add_header Cross-Origin-Resource-Policy same-origin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}
